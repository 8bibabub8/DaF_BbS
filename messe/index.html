<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6B4A">
<title>Messe-Hilfe · Naumburg</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --green:#1F6B4A; --green-soft:#E6F2EB; --peach:#FDEEDC; --peach-2:#F0C996;
  --ink:#17231D; --ink-2:#4B5A52; --bg:#F7F5F0; --card:#FFFFFF; --line:#DAD6CC; --ok:#1F8A4C; --bad:#B3261E;
  --der:#1F4E9C; --die:#B3261E; --das:#1F6B4A; --accent:#1F6B4A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root{ --bg:#101814; --card:#18231D; --ink:#EEF3EF; --ink-2:#A9B8AF; --line:#2C3A32; --green-soft:#1D3328; --peach:#3A2D1E; --peach-2:#6B4F2C; --der:#8FB3F0; --die:#F09A94; --das:#7DD3A6; --accent:#7DD3A6; } }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Arabic",sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100%}
header{background:var(--green);color:#fff;padding:12px 16px 14px;position:sticky;top:0;z-index:5;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pass{display:flex;align-items:center;gap:12px}
.hole{width:34px;height:9px;border-radius:6px;background:rgba(255,255,255,.35);margin-bottom:4px}
header h1{font-size:20px;margin:0;font-weight:700}
header p{margin:1px 0 0;font-size:14px;opacity:.85}
.langbtn{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
main{padding:16px 14px 110px}
h2{font-size:22px;margin:6px 4px 4px}
.lead{color:var(--ink-2);margin:0 4px 14px;font-size:16px}
.sect{font-size:16px;font-weight:700;color:var(--accent);margin:22px 6px 8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.card .de{font-size:20px;font-weight:700;line-height:1.25}
.card .tr{font-size:16px;color:var(--ink-2);margin-top:4px}
.card .sub{font-size:15px;color:var(--ink-2);margin-top:2px}
[dir=rtl]{text-align:right}
.a-der{color:var(--der);font-weight:700}.a-die{color:var(--die);font-weight:700}.a-das{color:var(--das);font-weight:700}
.show{background:var(--peach);border:2px dashed var(--peach-2);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.show b{display:block;font-size:21px;margin-bottom:4px}
.show span{color:var(--ink-2);font-size:15px}
.big{position:fixed;inset:0;background:#fff;color:#111;z-index:50;display:none;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;overflow:auto}
.big.on{display:flex}
.big .t{font-size:clamp(28px,8.5vw,44px);font-weight:700;line-height:1.22;margin:0 0 20px}
.big .t.long{font-size:clamp(22px,6.2vw,32px);text-align:left}
.big small{font-size:16px;color:#666}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{background:none;border:0;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:26px;height:26px;fill:currentColor}
nav button.on{color:var(--accent);background:var(--green-soft)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.langs button{padding:14px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;cursor:pointer}
.langs button.on{border-color:var(--green);background:var(--green-soft);font-weight:700}
/* Rallye */
.prog{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.prog .bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog .bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.box2{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.box2.done{border-color:var(--green);box-shadow:inset 5px 0 0 var(--green)}
.box2 h3{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.box2 h3 .ok{font-size:14px;color:var(--ok);font-weight:700}
label.f{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
input.t{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input.t:focus{outline:2px solid var(--green);border-color:var(--green)}
select.t{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.find{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.find span{flex:0 0 42%;font-size:16px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--green);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--peach);color:var(--ink)}
.btn.ghost{background:none;color:var(--ink-2);border:1.5px solid var(--line);font-weight:600;font-size:16px}
/* Üben */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.game b{font-size:18px;line-height:1.2}
.game span{font-size:14px;color:var(--ink-2)}
.game .rec{font-size:13px;color:var(--accent);font-weight:700;margin-top:6px}
.stat{display:flex;gap:10px;margin:4px 0 6px}
.stat div{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent)}
.stat span{font-size:13px;color:var(--ink-2)}
.quiz .progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 2px 12px}
.quiz .progress i{display:block;height:100%;background:var(--green);transition:width .3s}
.quiz .q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 16px;margin-bottom:14px;text-align:center}
.quiz .q .p{font-size:15px;color:var(--ink-2);margin-bottom:8px}
.quiz .q .m{font-size:24px;font-weight:700;line-height:1.3}
.quiz .q .tr{color:var(--ink-2);margin-top:8px;font-size:17px}
.quiz .opts button{display:block;width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:19px;font-weight:600;cursor:pointer;text-align:left}
.quiz .opts.art{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quiz .opts.art button{text-align:center;font-size:24px;padding:20px 0;margin:0}
.quiz .opts button.a-der{color:var(--der)}.quiz .opts button.a-die{color:var(--die)}.quiz .opts button.a-das{color:var(--das)}
.quiz .opts button.ok{border-color:var(--ok);background:#E3F4EA;color:#10301E}
.quiz .opts button.bad{border-color:var(--bad);background:#FBE5E3;color:#4A0F0B}
.build{min-height:64px;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.build.ok{border-color:var(--ok);border-style:solid;background:#E3F4EA;color:#10301E}
.build.bad{border-color:var(--bad);border-style:solid}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--peach);color:var(--ink);font:inherit;font-size:19px;font-weight:600;cursor:pointer}
.build .tile{background:var(--green-soft)}
.tile.used{visibility:hidden}
.sol{font-size:16px;color:var(--ink-2);text-align:center;margin:0 0 10px}
.end{text-align:center}
.end .m{font-size:48px;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="pass">
      <div><div class="hole" aria-hidden="true"></div><h1>Messe-Hilfe</h1><p>Ausbildungsmesse Naumburg</p></div>
      <button class="langbtn" id="langbtn" aria-label="Meine Sprache wählen">🌐 <span id="langname">Sprache</span></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="big" id="big" role="dialog"><div class="t" id="bigt"></div><small>Antippen zum Schließen</small></div>
<div class="sheet" id="sheet"><div class="box"><h2>Meine Sprache</h2><div class="lead">Wähle deine Sprache. Du siehst dann die Übersetzung.</div><div class="langs" id="langs"></div></div></div>
<nav><div class="in" id="nav"></div></nav>

<script>

const K = LANGS.map(l=>l[0]);
function T(arr){ const o={}; K.forEach((k,i)=>o[k]=arr[i]); return o; }

const FRAGEN = [
  {de:"Guten Tag! Ich heiße …", t:T(["مرحبًا! اسمي …","Добър ден! Казвам се …","Hello! My name is …","Bonjour ! Je m'appelle …","Jó napot! A nevem …","Bom dia! Meu nome é …","Bună ziua! Mă numesc …","Здравствуйте! Меня зовут …","İyi günler! Benim adım …","Добрий день! Мене звати …"])},
  {de:"Welche Ausbildung haben Sie?", t:T(["ما التدريب المهني الذي تقدّمونه؟","Какво професионално обучение предлагате?","Which apprenticeships do you offer?","Quelle formation proposez-vous ?","Milyen szakképzést kínálnak?","Que formação profissional vocês oferecem?","Ce formare profesională oferiți?","Какое профессиональное обучение вы предлагаете?","Hangi meslek eğitimini sunuyorsunuz?","Яке професійне навчання ви пропонуєте?"])},
  {de:"Wie lange dauert die Ausbildung?", t:T(["كم تستغرق مدة التدريب؟","Колко време продължава обучението?","How long does the apprenticeship take?","Combien de temps dure la formation ?","Mennyi ideig tart a képzés?","Quanto tempo dura a formação?","Cât durează formarea?","Сколько длится обучение?","Eğitim ne kadar sürüyor?","Скільки триває навчання?"])},
  {de:"Wann beginnt die Ausbildung?", t:T(["متى يبدأ التدريب؟","Кога започва обучението?","When does the apprenticeship start?","Quand commence la formation ?","Mikor kezdődik a képzés?","Quando começa a formação?","Când începe formarea?","Когда начинается обучение?","Eğitim ne zaman başlıyor?","Коли починається навчання?"])},

  {de:"Kann ich ein Praktikum machen?", t:T(["هل يمكنني القيام بتدريب عملي؟","Мога ли да направя стаж?","Can I do an internship?","Est-ce que je peux faire un stage ?","Csinálhatok szakmai gyakorlatot?","Posso fazer um estágio?","Pot să fac un stagiu de practică?","Могу ли я пройти практику?","Staj yapabilir miyim?","Чи можу я пройти практику?"])},
  {de:"Danke! Auf Wiedersehen!", t:T(["شكرًا! مع السلامة!","Благодаря! Довиждане!","Thank you! Goodbye!","Merci ! Au revoir !","Köszönöm! Viszontlátásra!","Obrigado! Até logo!","Mulțumesc! La revedere!","Спасибо! До свидания!","Teşekkürler! Hoşça kalın!","Дякую! До побачення!"])}];

const HILFE = [
  {de:"Können Sie das bitte langsam sagen?", t:T(["هل يمكنك أن تقول ذلك ببطء من فضلك؟","Може ли да го кажете по-бавно, моля?","Could you say that slowly, please?","Pouvez-vous le dire lentement, s'il vous plaît ?","Mondaná lassabban, kérem?","Pode falar mais devagar, por favor?","Puteți spune asta mai rar, vă rog?","Не могли бы вы сказать это помедленнее?","Lütfen yavaş söyler misiniz?","Чи могли б ви сказати це повільніше?"])},

  {de:"Ich verstehe das nicht. Noch einmal, bitte.", t:T(["لا أفهم. مرة أخرى من فضلك.","Не разбирам. Още веднъж, моля.","I don't understand. Once more, please.","Je ne comprends pas. Encore une fois, s'il vous plaît.","Nem értem. Még egyszer, kérem.","Não entendi. Mais uma vez, por favor.","Nu înțeleg. Încă o dată, vă rog.","Я не понимаю. Ещё раз, пожалуйста.","Anlamıyorum. Bir kez daha, lütfen.","Я не розумію. Ще раз, будь ласка."])}];

const ZEIGEN_T = T(["أنا أتعلّم الألمانية. من فضلك تكلّم ببطء وببساطة. شكرًا!","Уча немски. Моля, говорете бавно и просто. Благодаря!","I'm learning German. Please speak slowly and simply. Thank you!","J'apprends l'allemand. Parlez lentement et simplement, s'il vous plaît. Merci !","Németül tanulok. Kérem, beszéljen lassan és egyszerűen. Köszönöm!","Estou aprendendo alemão. Por favor, fale devagar e de forma simples. Obrigado!","Învăț germana. Vă rog să vorbiți rar și simplu. Mulțumesc!","Я учу немецкий. Пожалуйста, говорите медленно и просто. Спасибо!","Almanca öğreniyorum. Lütfen yavaş ve basit konuşun. Teşekkürler!","Я вивчаю німецьку. Будь ласка, говоріть повільно і просто. Дякую!"]);

const ANTWORTEN = [
  {de:"Die Ausbildung dauert drei Jahre.", t:T(["يستغرق التدريب ثلاث سنوات.","Обучението продължава три години.","The apprenticeship takes three years.","La formation dure trois ans.","A képzés három évig tart.","A formação dura três anos.","Formarea durează trei ani.","Обучение длится три года.","Eğitim üç yıl sürüyor.","Навчання триває три роки."])},
  {de:"Die Arbeit beginnt um 7 Uhr.", t:T(["يبدأ العمل في الساعة السابعة.","Работата започва в 7 часа.","Work starts at 7 o'clock.","Le travail commence à 7 heures.","A munka 7 órakor kezdődik.","O trabalho começa às 7 horas.","Lucrul începe la ora 7.","Работа начинается в 7 часов.","İş saat 7'de başlıyor.","Робота починається о 7 годині."])},
  {de:"Ja, gern.", t:T(["نعم، بكل سرور.","Да, с удоволствие.","Yes, of course.","Oui, volontiers.","Igen, szívesen.","Sim, claro.","Da, cu plăcere.","Да, конечно.","Evet, memnuniyetle.","Так, звісно."])},
  {de:"Nein, leider nicht.", t:T(["لا، للأسف.","Не, за съжаление.","No, unfortunately not.","Non, malheureusement pas.","Nem, sajnos nem.","Não, infelizmente não.","Nu, din păcate.","Нет, к сожалению, нет.","Hayır, maalesef.","Ні, на жаль, ні."])},
  {de:"Schreiben Sie uns eine E-Mail.", t:T(["اكتب لنا بريدًا إلكترونيًا.","Пишете ни имейл.","Send us an email.","Écrivez-nous un e-mail.","Írjon nekünk e-mailt.","Mande-nos um e-mail.","Scrieți-ne un e-mail.","Напишите нам электронное письмо.","Bize bir e-posta yazın.","Напишіть нам електронного листа."])},
  {de:"Hier ist unser Flyer.", t:T(["تفضّل، هذا منشورنا.","Ето нашата брошура.","Here is our flyer.","Voici notre dépliant.","Tessék, itt a szórólapunk.","Aqui está o nosso folheto.","Poftiți pliantul nostru.","Вот наша листовка.","Buyurun, broşürümüz.","Ось наша листівка."])},
  {de:"Bewerben Sie sich online.", t:T(["قدّم طلبك عبر الإنترنت.","Кандидатствайте онлайн.","Apply online.","Postulez en ligne.","Jelentkezzen online.","Candidate-se online.","Aplicați online.","Подайте заявку онлайн.","Online başvurun.","Подайте заявку онлайн."])},
  {de:"Wie alt sind Sie?", t:T(["كم عمرك؟","На колко години сте?","How old are you?","Quel âge avez-vous ?","Hány éves?","Quantos anos você tem?","Câți ani aveți?","Сколько вам лет?","Kaç yaşındasınız?","Скільки вам років?"])},
  {de:"Was möchten Sie werden?", t:T(["ماذا تريد أن تصبح؟","Какъв искате да станете?","What would you like to become?","Que voulez-vous devenir ?","Mi szeretne lenni?","O que você quer ser?","Ce vreți să deveniți?","Кем вы хотите стать?","Ne olmak istiyorsunuz?","Ким ви хочете стати?"])}];

const BERUFE = [
  {de:"der Verkäufer / die Verkäuferin", k:"Verkäufer/in", t:T(["بائع / بائعة","продавач / продавачка","sales assistant","vendeur / vendeuse","eladó","vendedor / vendedora","vânzător / vânzătoare","продавец","satış elemanı","продавець"])},
  {de:"der Koch / die Köchin", k:"Koch/Köchin", t:T(["طبّاخ / طبّاخة","готвач / готвачка","cook","cuisinier / cuisinière","szakács","cozinheiro / cozinheira","bucătar / bucătăreasă","повар","aşçı","кухар"])},
  {de:"der Pflegefachmann / die Pflegefachfrau", k:"Pflegefachmann/-frau", t:T(["ممرّض / ممرّضة","медицински брат / медицинска сестра","nurse","infirmier / infirmière","ápoló","enfermeiro / enfermeira","asistent medical / asistentă medicală","медбрат / медсестра","hemşire","медбрат / медсестра"])},

function bindRallye(){
  $$("[data-me]").forEach(el=>el.oninput=el.onchange=()=>{ R.me[el.dataset.me]=el.value; saveR(); });
  $$("[data-st]").forEach(el=>el.oninput=()=>{ R.st[el.dataset.st][el.dataset.k]=el.value; saveR(); updProg(el.closest(".box2"), +el.dataset.st); });
  $$("[data-find]").forEach(el=>el.oninput=()=>{ R.find[el.dataset.find]=el.value; saveR(); updProg(); });
  $("#fav").oninput=e=>{ R.fav=e.target.value; saveR(); updProg(); };
  $$("[data-chips]").forEach(g=>g.onclick=e=>{
    const b=e.target.closest(".chip"); if(!b) return; const name=g.dataset.chips, v=b.dataset.v, multi=!!g.dataset.multi;
    if(name==="gern"||name==="suche"){ const a=R.me[name]; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); }
    else { const idx=+name.slice(-1), key=name.slice(0,-1); R.st[idx][key] = R.st[idx][key]===v ? "" : v; updProg(g.closest(".box2"), idx); }
    saveR();
    if(multi) b.classList.toggle("on"); else { const idx=+name.slice(-1), key=name.slice(0,-1); g.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", R.st[idx][key]===c.dataset.v)); }
  });

function makeItems(id){
  const it=[];
  if(id==="beruf"){ pick(BERUFE.map((b,i)=>i),10).forEach(i=>{ const others=pick(BERUFE.map((b,j)=>j).filter(j=>j!==i && BERUF_MF[j][2]!==BERUF_MF[i][2]),2);
      it.push({p:"Welcher Beruf ist das?", m: lang?BERUFE[i].t[lang]:"arbeitet "+BERUF_MF[i][2], mrtl:!!lang, right:BERUFE[i].k, opts:shuffle([BERUFE[i].k,...others.map(j=>BERUFE[j].k)])}); }); }
  if(id==="artikel"){ pick(ARTIKEL,10).forEach(([w,a])=>it.push({p:"Welcher Artikel?", m:w, right:a, opts:["der","die","das"], art:true})); }
  if(id==="ort"){ pick(BERUF_MF,10).forEach(([m,f,o])=>{ const w=Math.random()<.5?"der "+m:"die "+f; const who=m==="Fachkraft für Lagerlogistik"?"die Fachkraft für Lagerlogistik":w;
      it.push({p:"Wo arbeitet …", m:who+"?", right:o, opts:shuffle([o,...pick(ORTE.filter(x=>x!==o),2)])}); }); }
  if(id==="form"){ const src=shuffle(FORMEN); for(let k=0;k<10;k++){ const [m,f,w]=src[k%src.length]; it.push({p:"Mann → Frau", m:m+" → die …", right:f, opts:shuffle([f,...w])}); } }
  if(id==="situation"){ pick(SITUATION,10).forEach(([s,a])=>it.push({p:"Was sagst du?", m:s, right:a, opts:shuffle([a,...pick(SITUATION.filter(x=>x[1]!==a).map(x=>x[1]),2)])})); }
  if(id==="paar"){ pick(PAARE,10).forEach(([q,a],k)=>{ if(k%2===0) it.push({p:"Was ist die Antwort?", m:q, right:a, opts:shuffle([a,...pick(PAARE.filter(x=>x[1]!==a).map(x=>x[1]),2)])});
      else it.push({p:"Was ist die Frage?", m:a, right:q, opts:shuffle([q,...pick(PAARE.filter(x=>x[0]!==q).map(x=>x[0]),2)])}); }); }
  if(id==="luecke"){ pick(LUECKEN,10).forEach(([s,r,w])=>it.push({p:"Was fehlt?", m:s, right:r, opts:shuffle([r,...w])})); }
  if(id==="bauen"){ pick(SAETZE,10).forEach(s=>it.push({build:true, right:s})); }
  return it;
}
function playGame(id){
  const items=makeItems(id); let i=0, score=0;
  const name=GAMES.find(g=>g.id===id).name;
  function next(ok){ if(ok) score++; setTimeout(()=>{ i++; i<items.length?render():finish(); }, ok?700:1700); }
  function render(){
    const it=items[i];
    const head=`<div class="progress"><i style="width:${i*10}%"></i></div>`;
    if(it.build){ renderBuild(it, head); return; }
    $("#main").innerHTML=`<div class="quiz">${head}<div class="q"><div class="p">${esc(name)} · ${i+1}/10 · ${esc(it.p)}</div>
      <div class="m"${it.mrtl?rtl():""}>${esc(it.m)}</div></div>
      <div class="opts ${it.art?"art":""}">${it.opts.map(o=>`<button data-o="${esc(o)}" ${it.art?`class="a-${o}"`:""}>${esc(o)}</button>`).join("")}</div>
      <button class="btn ghost" id="stop">Beenden</button></div>`;
    $("#stop").onclick=()=>show("ueben");
    let locked=false;
    $$(".opts button").forEach(b=>b.onclick=()=>{ if(locked) return; locked=true; const ok=b.dataset.o===it.right;
      b.classList.add(ok?"ok":"bad"); if(!ok) $$(".opts button").forEach(x=>{ if(x.dataset.o===it.right) x.classList.add("ok"); }); next(ok); });
  }
  function renderBuild(it, head){
    const words=it.right.split(" "); let order=shuffle(words.map((w,k)=>k)); if(words.length>1 && order.every((v,k)=>v===k)) order=order.reverse();
    const chosen=[];
    $("#main").innerHTML=`<div class="quiz">${head}<div class="q"><div class="p">${esc(name)} · ${i+1}/10</div><div class="m" style="font-size:18px">Tippe die Wörter in der richtigen Reihenfolge.</div></div>
      <div class="build" id="bld"></div><div class="tiles" id="tls">${order.map(k=>`<button class="tile" data-k="${k}">${esc(words[k])}</button>`).join("")}</div>
      <div class="sol" id="sol"></div><button class="btn" id="chk">Prüfen</button><button class="btn ghost" id="stop">Beenden</button></div>`;
    $("#stop").onclick=()=>show("ueben");
    const draw=()=>{ $("#bld").innerHTML=chosen.map((k,p)=>`<button class="tile" data-p="${p}">${esc(words[k])}</button>`).join("");
      $$("#tls .tile").forEach(t=>t.classList.toggle("used", chosen.includes(+t.dataset.k)));
      $$("#bld .tile").forEach(t=>t.onclick=()=>{ chosen.splice(+t.dataset.p,1); draw(); }); };
    $$("#tls .tile").forEach(t=>t.onclick=()=>{ const k=+t.dataset.k; if(!chosen.includes(k)){ chosen.push(k); draw(); } });
    let done=false;
    $("#chk").onclick=()=>{ if(done) return; if(chosen.length<words.length){ $("#sol").textContent="Nimm alle Wörter."; return; }
      done=true; const ok=chosen.map(k=>words[k]).join(" ")===it.right; $("#bld").classList.add(ok?"ok":"bad");
      if(!ok) $("#sol").textContent="Richtig: "+it.right; next(ok); };
  }
  function finish(){
    stats.rounds++; stats.points+=score; if(stats.best[id]==null || score>stats.best[id]) stats.best[id]=score; saveStats();
    $("#main").innerHTML=`<div class="quiz end"><div class="q"><div class="p">${esc(name)}</div><div class="m">${score}/10</div><div class="tr">${score>=9?"Super!":score>=6?"Gut gemacht!":"Weiter üben!"}</div></div>
      <button class="btn" id="again">Noch einmal</button><button class="btn alt" id="back">Anderes Spiel</button></div>`;
    $("#again").onclick=()=>playGame(id); $("#back").onclick=()=>show("ueben");
  }
  render(); window.scrollTo(0,0);
}

// ---------- Navigation ----------
const NAV = [
  ["rallye","Rallye",'<path d="M5 3h2v18H5zm3 1h11l-2.5 4L19 12H8z"/>'],
  ["saetze","Sätze",'<path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 5v2h10V8zm0 4v2h7v-2z"/>'],
  ["woerter","Wörter",'<path d="M10 4h4a2 2 0 0 1 2 2v1h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4V6a2 2 0 0 1 2-2zm0 3h4V6h-4z"/>'],
  ["ueben","Üben",'<path d="M12 2l3 6.3 7 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 7-1z"/>']];
function show(t){
  tab=t; store.set("tab",t); $("#main").innerHTML=PAGES[t]();
  $$("nav button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  $$(".card[data-big]").forEach(c=>c.onclick=()=>big(esc(c.dataset.big)));
  if(t==="rallye") bindRallye();
  if(t==="saetze") $("#zeigen").onclick=()=>big("Ich lerne Deutsch.<br>Bitte sprechen Sie langsam und einfach.<br>Danke!");
  if(t==="ueben") $$("[data-game]").forEach(b=>b.onclick=()=>playGame(b.dataset.game));
  window.scrollTo(0,0);
}
$("#nav").innerHTML=NAV.map(([k,l,p])=>`<button data-t="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>${l}</button>`).join("");
$$("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
$("#big").onclick=()=>$("#big").classList.remove("on");

function renderLangs(){
  $("#langs").innerHTML=LANGS.map(([k,n,r])=>`<button data-l="${k}" class="${lang===k?"on":""}"${r?' dir="rtl"':""}>${n}</button>`).join("")+`<button data-l="" class="${!lang?"on":""}">nur Deutsch</button>`;
  $$("#langs button").forEach(b=>b.onclick=()=>{ lang=b.dataset.l||null; store.set("lang",lang); $("#sheet").classList.remove("on"); updLang(); show(tab); });
}
function updLang(){ const l=LANGS.find(x=>x[0]===lang); $("#langname").textContent=l?l[1]:"Sprache"; }
$("#langbtn").onclick=()=>{ renderLangs(); $("#sheet").classList.add("on"); };
$("#sheet").onclick=e=>{ if(e.target.id==="sheet") $("#sheet").classList.remove("on"); };

updLang(); show(store.get("tab","rallye"));
if(lang===null && !store.get("asked",false)){ store.set("asked",true); renderLangs(); $("#sheet").classList.add("on"); }
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
