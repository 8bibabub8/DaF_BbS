:root{--bg:#F5F3EE;--ink:#1F2A24;--mut:#6B7570;--acc:#1F6B4A;--line:#E3DED3;--soft:#E9F4EE;--peach:#FDEEDC;
--der:#2F6FD6;--die:#D64545;--das:#2E9E64;--ok:#2E9E64;--no:#D64545;--k:#1F6B4A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hide{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar .t{font-weight:900;font-size:22px;line-height:1.15}
.bar .s{color:var(--mut);font-weight:700;font-size:14px}
.bar .sp{flex:1}
.pillbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.back{font-weight:800;color:var(--acc);font-size:15px;padding:6px 0;margin-bottom:6px}
h1.big{font-weight:900;font-size:clamp(28px,6vw,44px);color:var(--acc);line-height:1.1}
.lead{color:var(--mut);font-weight:700;margin:6px 0 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;width:100%;display:flex;gap:14px;align-items:center;transition:transform .12s}
.card:active{transform:scale(.98)}
.card .ic{width:56px;height:56px;flex:none}
.card .ct{font-weight:900;font-size:19px;line-height:1.2}
.card .cs{color:var(--mut);font-weight:700;font-size:14px;margin-top:2px}
.card .cm{margin-left:auto;font-weight:900;color:var(--acc);font-size:14px;white-space:nowrap}
.lang{flex-direction:column;align-items:flex-start;gap:2px}
.lang b{font-size:13px;color:var(--mut)}.lang span{font-weight:900;font-size:20px}
.kurs{border-width:3px}
.kurs .kb{width:54px;height:54px;border-radius:16px;color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 18px}
.tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border-top:6px solid var(--c)}
.tile .tt{font-weight:900;font-size:17px}.tile .tm{color:var(--mut);font-weight:700;font-size:13px}
.tile .tr{color:var(--mut);font-size:12px;font-weight:700}
.tile svg{width:40px;height:40px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800;margin:18px 0 8px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900;color:#fff;vertical-align:middle;margin-left:6px}
/* Grammatik */
.rule{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rule .de{font-weight:800;font-size:18px;line-height:1.4}
.rule .tr{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 12px;font-weight:700;color:#2b4a3a;line-height:1.45}
.rtl{direction:rtl;text-align:right}
table.gt{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;margin:4px 0 12px;font-size:16px}
.gt th{background:var(--peach);font-weight:900;text-align:left;padding:9px 10px;font-size:14px}
.gt td{padding:9px 10px;border-top:1px solid var(--line);font-weight:700}
.gt td:first-child{color:var(--mut);font-weight:800;white-space:nowrap}
.tscroll{overflow-x:auto;margin:4px 0 12px;-webkit-overflow-scrolling:touch}.tscroll table.gt{margin:0}
@media (max-width:520px){.gt th,.gt td{padding:8px 7px;font-size:15px}}
.exs{display:flex;flex-direction:column;gap:8px}
.exs div{background:#fff;border-left:5px solid var(--acc);border-radius:10px;padding:10px 14px;font-weight:700;font-size:17px}
b{font-weight:900;color:var(--acc)}
.trbtn{border:2px solid #CBE6D6;background:var(--soft);color:var(--acc);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;margin-bottom:12px}
/* Vokabeln */
input.search{width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin-bottom:10px;background:#fff}
.vrow{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.vrow .vw{font-weight:900;font-size:18px}
.vrow .vt{font-weight:800;color:#2b4a3a;margin-top:2px}
.vrow .vs{color:var(--mut);font-weight:700;font-size:14px;margin-top:4px;font-style:italic}
.a-der{color:var(--der)}.a-die{color:var(--die)}.a-das{color:var(--das)}
/* Übungen */
.prog{height:10px;background:#E7E2D7;border-radius:6px;overflow:hidden;margin:6px 0 16px}.prog div{height:100%;background:var(--acc);transition:width .3s}
.qhint{color:var(--mut);font-weight:700;font-size:14px;margin-bottom:4px}
.qhtr{color:#2b4a3a;font-weight:700;font-size:13px;margin-bottom:12px}
.q{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;font-weight:900;font-size:22px;line-height:1.35;margin-bottom:14px}
.q .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--acc);text-align:center;color:var(--acc)}
.opt{width:100%;background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:800;font-size:19px;text-align:left;margin-bottom:10px;display:flex;gap:12px;align-items:center;transition:background .2s,border-color .2s}
.opt.ok{border-color:var(--ok);background:#DFF3E7}.opt.no{border-color:var(--no);background:#FBE3E1}
.fb{font-weight:900;font-size:18px;min-height:28px;margin:4px 0 10px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.btn{display:block;width:100%;background:var(--acc);color:#fff;font-weight:900;font-size:18px;border-radius:16px;padding:14px;box-shadow:0 4px 0 #154a33}
.btn:disabled{opacity:.35}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.line{min-height:62px;background:#fff;border:3px dashed #CBE6D6;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.line.ok{border-style:solid;border-color:var(--ok);background:#DFF3E7}.line.no{border-style:solid;border-color:var(--no);background:#FBE3E1}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.w{background:#fff;border:3px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:800;font-size:18px}
.line .w{border-color:#9ED3B5}
.w.used{visibility:hidden}
.buckets{display:grid;gap:10px;margin-bottom:12px}
.bucket{background:#fff;border:3px solid var(--line);border-radius:16px;padding:16px;font-weight:900;font-size:20px}
.bucket.ok{border-color:var(--ok);background:#DFF3E7}.bucket.no{border-color:var(--no);background:#FBE3E1}
.result{text-align:center;padding:30px 0}
.result .big{font-weight:900;font-size:64px;color:var(--acc)}
.stars{font-size:34px;letter-spacing:6px;color:#E0B21C}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.foot{margin-top:26px;text-align:center;color:var(--mut);font-weight:700;font-size:13px}
.foot a{color:var(--acc)}

/* ============ BEAMER ============ */
#beamer{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.btop{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btop .brand{font-weight:900;color:var(--acc);font-size:20px}
.btop select{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff}
.stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:2vh 4vw}
.slide{width:100%;max-width:1500px;display:flex;flex-direction:column;gap:2vh;transform-origin:top center}
.stage{align-items:flex-start}
.slide h2{font-weight:900;font-size:clamp(28px,4.2vw,64px);line-height:1.1}
.slide .kick{font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(14px,1.4vw,22px)}
.brule{background:#fff;border:2px solid var(--line);border-radius:20px;padding:1.6vh 1.6vw;font-weight:800;font-size:clamp(18px,2.1vw,34px);line-height:1.35}
.brule .tr{margin-top:1vh;background:var(--soft);border-radius:12px;padding:.8vh 1vw;font-size:.75em;color:#2b4a3a}
.bcols{display:grid;grid-template-columns:1fr 1fr;gap:2vw;align-items:start}
.slide table.gt{font-size:clamp(16px,1.8vw,30px)}
.slide .gt th{font-size:.8em}
.slide .exs div{font-size:clamp(18px,2.1vw,34px);transition:opacity .3s,transform .3s}
.slide .exs div.hid{opacity:0;transform:translateY(10px)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw}
.vcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:1.6vh 1vw;text-align:center;cursor:pointer;min-height:13vh;display:flex;flex-direction:column;justify-content:center;gap:.6vh}
.vcard .vw{font-size:clamp(17px,1.8vw,32px);font-weight:900}
.vcard .vt{font-weight:800;color:#2b4a3a;font-size:clamp(14px,1.3vw,22px);visibility:hidden}
.vcard.on .vt{visibility:visible}
.vcard .vs{color:var(--mut);font-weight:700;font-size:clamp(12px,1vw,17px);font-style:italic}
.titlebox{display:grid;grid-template-columns:1.3fr 1fr;gap:4vw;align-items:center}
.qrbox{background:#fff;border-radius:22px;padding:2vh;border:2px solid var(--line);text-align:center}
.qrbox svg{width:100%;max-height:52vh;height:auto}
.qrbox .u{font-weight:800;color:var(--mut);font-size:clamp(12px,1vw,16px);word-break:break-all;margin-top:1vh}
.bnav{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-top:1px solid var(--line)}
.bnav .cnt{font-weight:800;color:var(--mut)}
.bnav .keys{margin-left:auto;color:var(--mut);font-size:13px;font-weight:700}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;font-family:inherit;font-weight:800}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:9px;height:9px;border-radius:50%;background:#D8D2C5}.dots i.on{background:var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="beamer" class="hide">
  <div class="btop">
    <span class="brand">Deutsch an der BbS</span>
    <select id="bKurs"></select><select id="bChap"></select>
    <span style="flex:1"></span>
    <span style="font-weight:800;color:var(--mut);font-size:14px">Übersetzung:</span><select id="bLang"></select>
    <button class="pillbtn" id="bFull">Vollbild</button>
  </div>
  <div class="stage"><div class="slide" id="bSlide"></div></div>
  <div class="bnav">
    <button class="pillbtn" id="bPrev">←</button><button class="pillbtn" id="bNext">→</button>
    <span class="cnt" id="bCnt"></span><div class="dots" id="bDots"></div>
    <span class="keys"><kbd>←</kbd><kbd>→</kbd> blättern · <kbd>T</kbd> Übersetzung · <kbd>F</kbd> Vollbild · Klick auf ein Wort = Übersetzung</span>
  </div>
</div>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

const S = { lang: store.get("lang", null), kurs: store.get("kurs", null), showTr: store.get("showTr", true) };
const app = $("#app");
const langBtn = () => `<button class="pillbtn" data-go="lang">${S.lang ? LANGS[LI(S.lang)].label : "🌐"}</button>`;
function bindGo() {

}
const scoreKey = (c, i) => `score.${c}.${i}`;

function viewLang(fromMenu) {
  app.innerHTML = `<h1 class="big">Deutsch an der BbS</h1><p class="lead">Wähle deine Sprache · ${LANGS.map((l, i) => i < 3 ? esc(trOf(UI.pickLang, l.code)) : "").filter(Boolean).join(" · ")}</p>
    <div class="grid g2">${LANGS.map((l) => `<button class="card lang" data-l="${l.code}"><b>${esc(l.de)}</b><span ${l.rtl ? 'dir="rtl"' : ""}>${esc(l.native)}</span></button>`).join("")}</div>`;
  app.querySelectorAll("[data-l]").forEach((b) => (b.onclick = () => { S.lang = b.dataset.l; store.set("lang", S.lang); if (fromMenu && S.kurs) viewChapters(); else if (!S.kurs) viewKurs(); else afterSetup(); }));
  scrollTo(0, 0);
}
function viewKurs() {
  app.innerHTML = `<div class="bar"><div><div class="t">Wähle deinen Kurs</div>${trSpan(trOf(UI.pickKurs, S.lang), S.lang, "s")}</div><span class="sp"></span>${langBtn()}</div>
    <div class="grid">${KURSE.map((k) => `<button class="card kurs" data-k="${k.id}"><span class="kb" style="background:${k.col}">${k.id.slice(1)}</span><div><div class="ct">${esc(k.name)}</div><div class="cs">Niveau ${esc(k.lvl)}</div></div></button>`).join("")}</div>`;
  app.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { S.kurs = b.dataset.k; store.set("kurs", S.kurs); afterSetup(); }));
  bindGo(); scrollTo(0, 0);
}
function chapDone(c) { const n = c.ex.filter((e) => !e.only || e.only === S.kurs).length; let d = 0; c.ex.forEach((e, i) => { if ((!e.only || e.only === S.kurs) && store.get(scoreKey(c.id, i), 0) >= 0.8) d++; }); return [d, n]; }
function viewChapters() {
  const k = kursOf(S.kurs), list = chapsFor(k.id);
  app.innerHTML = `<div class="bar"><div><div class="t">Deutsch · ${esc(k.name)}</div><div class="s">Niveau ${esc(k.lvl)} · Wähle ein Kapitel</div></div><span class="sp"></span><button class="pillbtn" data-go="kurs" style="border-color:${k.col};color:${k.col}">${esc(k.name)}</button>${langBtn()}</div>
    <div class="grid">${list.map((c) => { const [d, n] = chapDone(c); return `<button class="card" data-c="${c.id}"><span class="ic">${ICON[c.icon] || ""}</span><div><div class="ct">${esc(c.title)}</div><div class="cs">${esc(c.sub)}</div></div><span class="cm">${d}/${n} ✓</span></button>`; }).join("")}</div>
    <p class="foot">Für die Lehrkraft: <a href="?m=beamer&k=${k.id}">Beamer-Modus</a> · <a href="${ONLINE_URL}start/">Alle Apps</a></p>`;

      return `<button class="card" data-i="${i}"><span class="ic" style="width:44px;height:44px">${ICON[e.type === "vocab" ? "vocab" : "ex"]}</span><div><div class="ct">${esc(e.title)}${e.only ? `<span class="badge" style="background:${kursOf(e.only).col}">${esc(kursOf(e.only).name)}</span>` : ""}</div><div class="cs">${esc(hintDe(e.type === "vocab" ? "vocab" : e.type))}</div></div><span class="cm" style="color:#E0B21C;font-size:18px">${st}</span></button>`; }).join("")}</div>`;

// ---- Übungs-Spieler ----
function buildItems(c, e) {
  if (e.type === "choice") return shuffle(e.items).map(([q, o]) => { const ord = shuffle([0, 1, 2]); return { kind: "choice", q, opts: ord.map((k) => o[k]), r: ord.indexOf(0) }; });
  if (e.type === "order") return shuffle(e.items).map((s) => { const w = s.split(" "); let p = shuffle(w); for (let k = 0; k < 6 && p.join(" ") === s; k++) p = shuffle(w); return { kind: "order", ans: s, words: p }; });
  if (e.type === "sort") return shuffle(e.items).map(([w, b]) => ({ kind: "sort", w, b, buckets: e.buckets }));
  if (e.type === "vocab") {
    return shuffle(c.vocab).slice(0, 10).map((v) => { const others = shuffle(c.vocab.filter((x) => x !== v)).slice(0, 2); const ord = shuffle([v, ...others]);
      return { kind: "choice", q: trOf(v[1], S.lang), qtr: true, opts: ord.map((x) => x[0]), r: ord.indexOf(v), word: true }; });
  }
  return [];
}
function startEx(c, i, onBack) {
  const e = c.ex[i], items = buildItems(c, e), hk = e.type === "vocab" ? "vocab" : e.type;
  let k = 0, right = 0, tried = false;
  const next = () => { k++; tried = false; if (k >= items.length) done(); else draw(); };
  function frame(inner) {
    app.innerHTML = `<button class="back" id="bk">← Übungen</button><div class="bar"><div><div class="t">${esc(e.title)}</div><div class="s">${k + 1} / ${items.length}</div></div><span class="sp"></span></div>
      <div class="prog"><div style="width:${(k / items.length) * 100}%"></div></div>
      <div class="qhint">${esc(hintDe(hk))}</div>${trSpan(hintTr(hk, S.lang), S.lang, "qhtr")}${inner}`;
    $("#bk").onclick = onBack;
  }
  function feedback(ok, extra) {
    const fb = $("#fb"); fb.className = "fb pop " + (ok ? "ok" : "no"); fb.innerHTML = ok ? "✓ Richtig!" : "✗ " + (extra || "Leider falsch.");
    const nb = $("#nx"); nb.disabled = false; nb.focus();
    if (navigator.vibrate) navigator.vibrate(ok ? 30 : [60, 40, 60]);
  }
  function draw() {
    const it = items[k];
    if (it.kind === "choice") {
      const qh = it.qtr ? trSpan(it.q, S.lang, "") : md(it.q).replace(/___/g, '<span class="gap">?</span>');
      frame(`<div class="q">${qh}</div>${it.opts.map((o, j) => `<button class="opt" data-j="${j}">${it.word ? wordHTML(o) : esc(o)}</button>`).join("")}<div class="fb" id="fb"></div><button class="btn" id="nx" disabled>Weiter</button>`);
      app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
        if (!$("#nx").disabled) return; const j = +b.dataset.j, ok = j === it.r;
        if (ok) { right++; } app.querySelectorAll(".opt").forEach((x) => { const jj = +x.dataset.j; if (jj === it.r) x.classList.add("ok"); else if (jj === j) x.classList.add("no"); });
        if (!ok) b.classList.add("shake");
        if (!ok && it.q.includes("___")) { $(".q .gap").textContent = it.opts[it.r]; }
        feedback(ok);
      }));
    } else if (it.kind === "order") {
      let picked = [];
      const redraw = () => {
        frame(`<div class="line" id="ln">${picked.map((p, j) => `<button class="w" data-j="${j}">${esc(it.words[p])}</button>`).join("")}</div>
          <div class="pool">${it.words.map((w, p) => `<button class="w ${picked.includes(p) ? "used" : ""}" data-p="${p}">${esc(w)}</button>`).join("")}</div>
          <div class="fb" id="fb"></div><button class="btn" id="nx" disabled>Weiter</button>`);
        app.querySelectorAll(".pool .w").forEach((b) => (b.onclick = () => { const p = +b.dataset.p; if (!picked.includes(p)) { picked.push(p); redraw(); check(); } }));
        app.querySelectorAll("#ln .w").forEach((b) => (b.onclick = () => { if (!$("#nx").disabled) return; picked.splice(+b.dataset.j, 1); redraw(); }));
        $("#nx").onclick = next;
      };
      const check = () => {
        if (picked.length !== it.words.length) return;
        const s = picked.map((p) => it.words[p]).join(" "), ok = s === it.ans;
        if (ok && !tried) right++;
        const ln = $("#ln");
        if (ok) { ln.classList.add("ok"); feedback(true); }
        else if (!tried) { tried = true; ln.classList.add("no", "shake"); const fb = $("#fb"); fb.className = "fb no"; fb.textContent = "✗ Noch nicht. Versuch es noch einmal!"; setTimeout(() => { picked = []; redraw(); }, 1100); }
        else { ln.classList.add("no"); feedback(false, "Richtig ist: " + it.ans); }
      };
      redraw(); return;
    } else if (it.kind === "sort") {
      frame(`<div class="q" style="text-align:center">${esc(it.w)}</div><div class="buckets" style="grid-template-columns:repeat(${it.buckets.length},1fr)">${it.buckets.map((b, j) => `<button class="bucket" data-j="${j}">${esc(b)}</button>`).join("")}</div><div class="fb" id="fb"></div><button class="btn" id="nx" disabled>Weiter</button>`);
      app.querySelectorAll(".bucket").forEach((b) => (b.onclick = () => {
        if (!$("#nx").disabled) return; const j = +b.dataset.j, ok = j === it.b; if (ok) right++;
        app.querySelectorAll(".bucket").forEach((x) => { const jj = +x.dataset.j; if (jj === it.b) x.classList.add("ok"); else if (jj === j) x.classList.add("no"); });
        feedback(ok, ok ? "" : "Richtig ist: " + it.buckets[it.b]);
      }));
    }
    $("#nx").onclick = next;
  }
  function done() {
    const sc = right / items.length; const best = store.get(scoreKey(c.id, i), 0); if (sc > best) store.set(scoreKey(c.id, i), sc);
    const st = sc >= 0.999 ? "★★★" : sc >= 0.8 ? "★★☆" : sc >= 0.5 ? "★☆☆" : "☆☆☆";
    app.innerHTML = `<div class="result pop"><div class="stars">${st}</div><div class="big">${right} / ${items.length}</div>
      <p class="lead">${sc >= 0.999 ? "Perfekt! 🎉" : sc >= 0.8 ? "Sehr gut!" : sc >= 0.5 ? "Gut – übe noch einmal!" : "Lies die Grammatik und versuch es noch einmal."}</p>
      <div class="grid g2"><button class="btn ghost" id="ag">Noch einmal</button><button class="btn" id="bk2">Fertig</button></div></div>`;
    $("#ag").onclick = () => startEx(c, i, onBack); $("#bk2").onclick = onBack;
  }
  draw();
}

// =====================================================================
// ============================ BEAMER =================================
// =====================================================================
function Beamer() {
  document.body.style.overflow = "hidden"; $("#app").classList.add("hide"); $("#beamer").classList.remove("hide");
  const B = { kurs: params.get("k") || store.get("bKurs", "K2"), chap: params.get("c") || null, lang: store.get("bLang", "ru"), i: 0, step: 0, tr: false };
  const kSel = $("#bKurs"), cSel = $("#bChap"), lSel = $("#bLang");
  kSel.innerHTML = KURSE.map((k) => `<option value="${k.id}">${esc(k.name)}</option>`).join("");
  lSel.innerHTML = LANGS.map((l) => `<option value="${l.code}">${esc(l.de)}</option>`).join("");
  function fillChaps() { const l = chapsFor(B.kurs); cSel.innerHTML = l.map((c) => `<option value="${c.id}">${esc(c.title)}</option>`).join(""); if (!l.find((c) => c.id === B.chap)) B.chap = l[0] && l[0].id; cSel.value = B.chap; }
  kSel.value = B.kurs; lSel.value = B.lang; fillChaps();
  kSel.onchange = () => { B.kurs = kSel.value; store.set("bKurs", B.kurs); fillChaps(); B.i = 0; B.step = 0; render(); };
  cSel.onchange = () => { B.chap = cSel.value; B.i = 0; B.step = 0; render(); };
  lSel.onchange = () => { B.lang = lSel.value; store.set("bLang", B.lang); render(); };
  const chap = () => CHAPTERS.find((c) => c.id === B.chap);
  function slides() {
    const c = chap(); if (!c) return [];
    const out = [{ t: "title" }];
    c.grammar.forEach((g) => { if (!g.only || g.only === B.kurs) out.push({ t: "grammar", g }); });
    const nv = Math.ceil(c.vocab.length / 8), per = Math.ceil(c.vocab.length / nv);
    for (let j = 0; j < nv; j++) out.push({ t: "vocab", v: c.vocab.slice(j * per, (j + 1) * per), n: j + 1, of: nv });
    return out;
  }
  const studentUrl = () => `${location.protocol.startsWith("http") ? location.origin + location.pathname : ONLINE_URL}?k=${B.kurs}&c=${B.chap}`;
  function qrSvg(t) { const q = qrcode(0, "M"); q.addData(t); q.make(); return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); }
  function render() {
    const c = chap(), sl = slides(); if (!c) { $("#bSlide").innerHTML = "<h2>Kein Kapitel</h2>"; return; }
    B.i = Math.max(0, Math.min(B.i, sl.length - 1)); const s = sl[B.i];
    let h = "";
    if (s.t === "title") {
      h = `<div class="titlebox"><div><div class="kick">${esc(kursOf(B.kurs).name)} · Kapitel</div><h2 style="font-size:clamp(40px,6vw,96px);color:var(--acc)">${esc(c.title)}</h2>
        <div class="brule" style="margin-top:3vh">${esc(c.sub)}</div>
        <div class="brule" style="margin-top:2vh;font-size:clamp(16px,1.6vw,26px)">Grammatik: ${c.grammar.filter((g) => !g.only || g.only === B.kurs).map((g) => esc(g.title)).join(" · ")}<br>Wörter: ${c.vocab.length}</div></div>
        <div class="qrbox">${qrSvg(studentUrl())}<div style="font-weight:900;font-size:clamp(16px,1.6vw,26px)">Mit dem Handy scannen und üben!</div><div class="u">${esc(studentUrl())}</div></div></div>`;
    } else if (s.t === "grammar") {
      const g = s.g, nEx = g.ex.length;
      const rules = g.rules.map((r) => `<div class="brule">${md(r[0])}${B.tr ? trSpan(trOf(r[1], B.lang), B.lang, "tr") : ""}</div>`).join("");
      const exs = `<div class="exs">${g.ex.map((e, j) => `<div class="${j < B.step ? "" : "hid"}">${md(e)}</div>`).join("")}</div>`;
      h = `<div class="kick">Grammatik · ${esc(c.title)}</div><h2>${esc(g.title)}</h2>
        ${g.table ? `<div class="bcols"><div style="display:flex;flex-direction:column;gap:1.4vh">${rules}</div><div>${tableHTML(g.table)}${exs}</div></div>` : `${rules}${exs}`}`;
      s.steps = nEx;
    } else {
      h = `<div class="kick">Wörter · ${esc(c.title)} · ${s.n}/${s.of}</div>
        <div class="vgrid">${s.v.map((v) => `<div class="vcard ${B.tr ? "on" : ""}"><div class="vw">${wordHTML(v[0])}</div>${trSpan(trOf(v[1], B.lang), B.lang, "vt")}<div class="vs">${esc(v[2])}</div></div>`).join("")}</div>`;
    }
    const el = $("#bSlide"); el.style.transform = ""; el.innerHTML = h;
    requestAnimationFrame(() => { const st = el.parentElement, avail = st.clientHeight - 24, need = el.scrollHeight; const k = need > avail ? avail / need : 1;
      el.style.transform = k < 1 ? `scale(${k})` : ""; st.style.alignItems = k < 1 ? "flex-start" : "center"; });
    $("#bSlide").querySelectorAll(".vcard").forEach((x) => (x.onclick = () => x.classList.toggle("on")));
    $("#bCnt").textContent = `${B.i + 1} / ${sl.length}`;
    $("#bDots").innerHTML = sl.map((_, j) => `<i class="${j === B.i ? "on" : ""}"></i>`).join("");
  }
  function go(d) {
    const sl = slides(), s = sl[B.i];
    if (d > 0 && s && s.t === "grammar" && B.step < s.g.ex.length) { B.step++; render(); return; }
    if (d < 0 && s && s.t === "grammar" && B.step > 0) { B.step--; render(); return; }
    const ni = B.i + d; if (ni < 0 || ni >= sl.length) return; B.i = ni; const ns = sl[ni]; B.step = d < 0 && ns.t === "grammar" ? ns.g.ex.length : 0; render();
  }
  $("#bPrev").onclick = () => go(-1); $("#bNext").onclick = () => go(1);
  $("#bFull").onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); };
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key.toLowerCase() === "t") { B.tr = !B.tr; render(); }
    else if (e.key.toLowerCase() === "f") $("#bFull").click();
  });
  addEventListener("resize", () => render());
  render();
}

// ================= Start =================
let pendingChap = params.get("c");
function afterSetup() {
  const c = pendingChap && CHAPTERS.find((x) => x.id === pendingChap && x.kurse.includes(S.kurs)); pendingChap = null;
  if (c) viewChapter(c.id); else viewChapters();
}
if (params.get("m") === "beamer") Beamer();
else {
  const k = params.get("k");
  if (k && KURSE.find((x) => x.id === k)) { S.kurs = k; store.set("kurs", k); }
  if (!S.lang) viewLang(false); else if (!S.kurs) viewKurs(); else afterSetup();
}
</script>
